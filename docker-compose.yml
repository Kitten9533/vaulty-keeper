# vaulty-keeper agent container: isolates agent CLIs (codex/claude/opencode/pi)
# from the host. The host runs 'vaulty-keeper serve' and holds the snapshot keys;
# this container only ever receives masked values via the bridge token.
#
# Usage:
#   1. On the host (with the keys):
#        vaulty-keeper serve --addr 0.0.0.0:8970
#      (0.0.0.0 makes the bridge reachable from the Docker VM; the token gates
#       it and it only ever returns masked values.)
#   2. Start the container:
#        export VAULTY_KEEPER_BRIDGE_TOKEN="$(cat ~/.vaulty/bridge-token)"
#        docker compose up -d
#   3. Run an agent CLI inside:
#        docker compose exec agent codex
#      (or let the entrypoint install CLIs first, see VAULTY_KEEPER_INSTALL_AGENTS)
#
# Mounting: only the project dir is mounted. The host's ~/.vaulty,
# Keychain/Credential Manager, ~/.ssh and the docker socket are deliberately
# NOT mounted, so an agent inside cannot read keys or ciphertext.
services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: vaulty-keeper-agent:local
    container_name: vaulty-keeper-agent
    stdin_open: true
    tty: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      VAULTY_KEEPER_BRIDGE_ADDR: ${VAULTY_KEEPER_BRIDGE_ADDR:-http://host.docker.internal:8970}
      VAULTY_KEEPER_BRIDGE_TOKEN: "${VAULTY_KEEPER_BRIDGE_TOKEN:?export VAULTY_KEEPER_BRIDGE_TOKEN (host: cat ~/.vaulty/bridge-token)}"
      VAULTY_KEEPER_INSTALL_AGENTS: ${VAULTY_KEEPER_INSTALL_AGENTS:-}
    extra_hosts:
      # Makes host.docker.internal work on Linux Docker (harmless on Docker
      # Desktop for macOS/Windows, where it is already provided).
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VAULTY_KEEPER_PROJECT_DIR:-./}:/workspace
      # Persist the agent's home (installed CLIs, session history) across
      # container recreations. The host's secrets are still never mounted.
      - agent-home:/home/agent
    working_dir: /workspace
volumes:
  agent-home:
