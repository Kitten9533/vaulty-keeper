name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go vet ./...
      - run: node scripts/check-ui.mjs
      - run: node scripts/check-docs.mjs
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: make release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; skipping create"
          else
            gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip \
              --repo "$GITHUB_REPOSITORY" --title "vaulty-keeper $GITHUB_REF_NAME" \
              --notes "Prebuilt binaries: macOS/linux × x86_64/arm64, Windows × x86_64 (with README & LICENSE). See README「Quick Start」for build instructions."
          fi