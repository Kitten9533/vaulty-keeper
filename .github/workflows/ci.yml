name: ci

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go vet ./...
      - name: Run tests
        run: go test -v ./... 2>&1 | tee /tmp/test-output.txt; test ${PIPESTATUS[0]} -eq 0
      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: /tmp/test-output.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: make release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip \
            --repo "$GITHUB_REPOSITORY" --title "vaulty-keeper $GITHUB_REF_NAME" \
            --notes "预编译二进制：darwin/linux/windows × amd64/arm64（含 README 与 LICENSE）。构建方式见 README「快速开始」。"